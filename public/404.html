<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | PDFShock</title>
  <!-- Vraie 404 : sans ce fichier, Cloudflare Pages renvoie l'accueil en 200 (soft 404). -->
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { --bg: #0a0e1c; --text: #e7ecfb; --text-muted: #93a0c9; --accent: #4f9dff; --accent-hover: #6babff; --accent-cyan: #9fe8ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #121a3a, var(--bg) 60%);
      color: var(--text-muted); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 48px 16px; text-align: center;
    }
    main { max-width: 440px; }
    img { border-radius: 12px; image-rendering: pixelated; }
    h1 { color: var(--text); font-size: 28px; letter-spacing: -0.02em; margin: 20px 0 8px; }
    p { margin: 0 0 28px; }
    a.btn { display: inline-block; border-radius: 10px; padding: 12px 18px; font-weight: 600; text-decoration: none; background: var(--accent); color: #fff; }
    a.btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="" width="64" height="64" />
    <h1>This page got zapped</h1>
    <p>The wizard looked everywhere, but this page does not exist.</p>
    <a class="btn" href="/">⚡ Back to PDFShock</a>
  </main>
</body>
</html>
